name: atodotren

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ATODOTREN_WORKER_PASSWORD: ${ATODOTREN_WORKER_PASSWORD:?ATODOTREN_WORKER_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init/001-runtime-roles.sh:/docker-entrypoint-initdb.d/001-runtime-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: atodotren-worker:milestone-2
    entrypoint: ["node", "apps/worker/dist/migrate.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://atodotren_worker:${ATODOTREN_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://atodotren_migrator:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: "no"

  static-import:
    image: atodotren-worker:milestone-2
    command: ["import-static", "--json"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://atodotren_worker:${ATODOTREN_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
      GTFS_STATIC_REQUIRED_LINE_CODES: ${GTFS_STATIC_REQUIRED_LINE_CODES:-}
      GTFS_STATIC_REQUIRED_STATION_IDS: ${GTFS_STATIC_REQUIRED_STATION_IDS:-}
      GTFS_STATIC_TEMP_DIR: ${GTFS_STATIC_TEMP_DIR:-/tmp}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  spool-init:
    image: atodotren-worker:milestone-2
    user: root
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /spool && chown 1000:1000 /spool"]
    volumes:
      - realtime-spool:/spool
    restart: "no"

  worker:
    image: atodotren-worker:milestone-2
    command: ["ingest"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://atodotren_worker:${ATODOTREN_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
      DOCTOR_MAX_CLOCK_SKEW_MS: ${DOCTOR_MAX_CLOCK_SKEW_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      GTFS_RT_TRIP_UPDATES_ENABLED: ${GTFS_RT_TRIP_UPDATES_ENABLED:-true}
      GTFS_RT_TRIP_UPDATES_URL: ${GTFS_RT_TRIP_UPDATES_URL:-https://gtfsrt.renfe.com/trip_updates.pb}
      GTFS_RT_VEHICLE_POSITIONS_ENABLED: ${GTFS_RT_VEHICLE_POSITIONS_ENABLED:-true}
      GTFS_RT_VEHICLE_POSITIONS_URL: ${GTFS_RT_VEHICLE_POSITIONS_URL:-https://gtfsrt.renfe.com/vehicle_positions.pb}
      GTFS_RT_SERVICE_ALERTS_ENABLED: ${GTFS_RT_SERVICE_ALERTS_ENABLED:-true}
      GTFS_RT_SERVICE_ALERTS_URL: ${GTFS_RT_SERVICE_ALERTS_URL:-https://gtfsrt.renfe.com/alerts.pb}
      GTFS_RT_REQUEST_TIMEOUT_MS: ${GTFS_RT_REQUEST_TIMEOUT_MS:-10000}
      GTFS_RT_MAX_RESPONSE_BYTES: ${GTFS_RT_MAX_RESPONSE_BYTES:-33554432}
      GTFS_RT_CYCLE_INTERVAL_MS: ${GTFS_RT_CYCLE_INTERVAL_MS:-30000}
      GTFS_RT_ALERT_INTERVAL_MS: ${GTFS_RT_ALERT_INTERVAL_MS:-60000}
      SQLITE_SPOOL_PATH: /spool/realtime.sqlite
      SQLITE_SPOOL_MAX_BYTES: ${SQLITE_SPOOL_MAX_BYTES:-1073741824}
      SQLITE_SPOOL_MAX_BACKLOG_MS: ${SQLITE_SPOOL_MAX_BACKLOG_MS:-172800000}
      SQLITE_SPOOL_WARNING_RATIO: ${SQLITE_SPOOL_WARNING_RATIO:-0.75}
      INGEST_ALERT_FAILURE_THRESHOLD: ${INGEST_ALERT_FAILURE_THRESHOLD:-3}
      INGEST_STALE_AFTER_MS: ${INGEST_STALE_AFTER_MS:-120000}
      INGEST_MATCHING_RATE_MINIMUM: ${INGEST_MATCHING_RATE_MINIMUM:-0.02}
      INGEST_MATCHING_RATE_RECOVERY_MINIMUM: ${INGEST_MATCHING_RATE_RECOVERY_MINIMUM:-0.05}
      INGEST_MATCHING_RECOVERY_THRESHOLD: ${INGEST_MATCHING_RECOVERY_THRESHOLD:-3}
      INGEST_MALFORMED_RATE_MAXIMUM: ${INGEST_MALFORMED_RATE_MAXIMUM:-0.25}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - realtime-spool:/spool
    depends_on:
      static-import:
        condition: service_completed_successfully
      spool-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  realtime-spool:

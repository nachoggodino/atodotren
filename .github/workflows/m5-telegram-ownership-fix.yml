name: Enforce Telegram Sender Ownership

on:
  push:
    branches:
      - feature-milestone-5

permissions:
  contents: write

jobs:
  refactor-worker-telegram:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-5
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Remove worker-owned Telegram sender
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/worker/src/dispatcher.ts')
          text = path.read_text()
          old_import = '  createSmtpTransport,\n  createTelegramTransport,\n  OutageSpool,'
          new_import = '  createSmtpTransport,\n  OutageSpool,'
          if text.count(old_import) != 1:
              raise SystemExit('expected createTelegramTransport import exactly once')
          text = text.replace(old_import, new_import)

          old_transports = '''    const transports = [
              ...(config.operations.telegram === undefined ? [] : [createTelegramTransport(config.operations.telegram)]),
              ...(config.operations.smtp === undefined ? [] : [createSmtpTransport(config.operations.smtp)]),
            ];'''
          new_transports = '''    const transports = [
              ...(config.operations.smtp === undefined ? [] : [createSmtpTransport(config.operations.smtp)]),
            ];'''
          # Normalize indentation-independent exact block used twice in source.
          old_transports = old_transports.replace('    const transports', 'const transports').replace('      ...(', '  ...(').replace('    ];', '];')
          new_transports = new_transports.replace('    const transports', 'const transports').replace('      ...(', '  ...(').replace('    ];', '];')
          if text.count(old_transports) != 2:
              raise SystemExit(f'expected legacy transport block twice, found {text.count(old_transports)}')
          text = text.replace(old_transports, new_transports)

          old_usage = '''Sends one clearly labelled test through each configured Telegram, SMTP, and
          heartbeat channel.'''.replace('          ', '')
          new_usage = '''Sends one clearly labelled test through each configured SMTP and heartbeat
          channel. Telegram delivery belongs exclusively to the telegram-ops service.'''.replace('          ', '')
          if text.count(old_usage) != 1:
              raise SystemExit('expected legacy test-notifications wording exactly once')
          text = text.replace(old_usage, new_usage)
          if 'createTelegramTransport' in text:
              raise SystemExit('dispatcher still references createTelegramTransport')
          path.write_text(text)
          PY

          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          needle = '''          if grep -Eq 'TELEGRAM_BOT_TOKEN|TELEGRAM_PRIVATE_CHAT_ID|TELEGRAM_ALLOWED_USER_ID' <<<"$worker_block"; then
            echo 'The ingestion worker must not receive Telegram credentials.' >&2
            exit 1
          fi
'''
          replacement = needle + '''          if grep -q 'createTelegramTransport' apps/worker/src/dispatcher.ts; then
            echo 'The ingestion worker must not own a Telegram sender transport.' >&2
            exit 1
          fi
'''
          if text.count(needle) != 1:
              raise SystemExit('expected Telegram ownership gate anchor exactly once')
          path.write_text(text.replace(needle, replacement))
          PY
          git diff --check
          ! grep -q 'createTelegramTransport' apps/worker/src/dispatcher.ts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Commit verified ownership refactor and self-clean workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/m5-telegram-ownership-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/dispatcher.ts .github/workflows/ci.yml
          git commit -m 'refactor: make telegram-ops sole Telegram sender'
          git push origin HEAD:feature-milestone-5

name: Milestone 4 CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  m4-materialize-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature-milestone-4'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
          fetch-depth: 0
      - name: Materialize migration 0006 inventory and repair invalidation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tests = Path('tests/integration/postgres.test.ts')
          text = tests.read_text()
          copy_0005 = """    cp(
      resolve(process.cwd(), 'migrations/0005_canonical_journeys.sql'),
      join(directory, '0005_canonical_journeys.sql'),
    ),
"""
          copy_0006 = """    cp(
      resolve(process.cwd(), 'migrations/0006_aggregation_retention.sql'),
      join(directory, '0006_aggregation_retention.sql'),
    ),
"""
          if copy_0006 not in text:
              if copy_0005 not in text:
                  raise SystemExit('0005 copy anchor missing')
              text = text.replace(copy_0005, copy_0005 + copy_0006, 1)
          text = text.replace(
              "        '0005_canonical_journeys.sql',\n      ]);",
              "        '0005_canonical_journeys.sql',\n        '0006_aggregation_retention.sql',\n      ]);",
          )
          tests.write_text(text)

          migration = Path('migrations/0006_aggregation_retention.sql')
          sql = migration.read_text()

          old_mark_dirty = """  UPDATE operations.retention_ledger
  SET revoked_at = clock_timestamp()
  WHERE family = 'canonical_detail' AND target_date = analytics.mark_dirty.target_date
    AND applied_at IS NULL AND revoked_at IS NULL;
END
$function$;
"""
          new_mark_dirty = """  UPDATE operations.retention_ledger
  SET revoked_at = clock_timestamp()
  WHERE family = 'canonical_detail' AND target_date = analytics.mark_dirty.target_date
    AND applied_at IS NULL AND revoked_at IS NULL;

  -- One anonymous daily contribution is replaceable while its month is open.
  -- A sealed month is immutable for this aggregate version and is repaired only
  -- through a newer aggregate/methodology version.
  DELETE FROM analytics.daily_schedule_contribution AS contribution
  USING operations.service_day_finalization AS finalization
  WHERE contribution.service_date = analytics.mark_dirty.target_date
    AND finalization.service_date = contribution.service_date
    AND finalization.aggregate_algorithm_version = contribution.aggregate_algorithm_version
    AND NOT EXISTS (
      SELECT 1 FROM operations.month_seal AS seal
      WHERE seal.calendar_month = date_trunc('month', contribution.service_date)::date
        AND seal.aggregate_algorithm_version = contribution.aggregate_algorithm_version
        AND seal.status = 'sealed'
    );

  DELETE FROM operations.service_day_finalization AS finalization
  WHERE finalization.service_date = analytics.mark_dirty.target_date
    AND NOT EXISTS (
      SELECT 1 FROM operations.month_seal AS seal
      WHERE seal.calendar_month = date_trunc('month', finalization.service_date)::date
        AND seal.aggregate_algorithm_version = finalization.aggregate_algorithm_version
        AND seal.status = 'sealed'
    );
END
$function$;
"""
          if new_mark_dirty not in sql:
              if old_mark_dirty not in sql:
                  raise SystemExit('mark_dirty anchor missing')
              sql = sql.replace(old_mark_dirty, new_mark_dirty, 1)

          old_insert_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_insert_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
BEGIN
  INSERT INTO analytics.dirty_scope (service_date, family, reason)
  SELECT DISTINCT changed.service_date, family.value, 'canonical-insert'
  FROM new_rows AS changed
  CROSS JOIN (VALUES ('daily'::text), ('schedule'::text)) AS family(value)
  ON CONFLICT (service_date, family) DO UPDATE SET
    dirty_since = LEAST(analytics.dirty_scope.dirty_since, EXCLUDED.dirty_since),
    generation = analytics.dirty_scope.generation + 1,
    reason = EXCLUDED.reason;
  UPDATE operations.retention_ledger ledger
  SET revoked_at = clock_timestamp()
  WHERE ledger.family = 'canonical_detail' AND ledger.applied_at IS NULL AND ledger.revoked_at IS NULL
    AND ledger.target_date IN (SELECT DISTINCT service_date FROM new_rows);
  RETURN NULL;
END
$function$;
"""
          new_insert_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_insert_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
DECLARE
  affected_date date;
BEGIN
  FOR affected_date IN SELECT DISTINCT service_date FROM new_rows LOOP
    PERFORM analytics.mark_dirty(affected_date, 'canonical-insert');
  END LOOP;
  RETURN NULL;
END
$function$;
"""
          if new_insert_trigger not in sql:
              if old_insert_trigger not in sql:
                  raise SystemExit('insert dirty trigger anchor missing')
              sql = sql.replace(old_insert_trigger, new_insert_trigger, 1)

          old_update_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_update_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
BEGIN
  INSERT INTO analytics.dirty_scope (service_date, family, reason)
  SELECT DISTINCT changed.service_date, family.value, 'canonical-update'
  FROM (
    SELECT service_date FROM new_rows UNION SELECT service_date FROM old_rows
  ) AS changed
  CROSS JOIN (VALUES ('daily'::text), ('schedule'::text)) AS family(value)
  ON CONFLICT (service_date, family) DO UPDATE SET
    dirty_since = LEAST(analytics.dirty_scope.dirty_since, EXCLUDED.dirty_since),
    generation = analytics.dirty_scope.generation + 1,
    reason = EXCLUDED.reason;
  UPDATE operations.retention_ledger ledger
  SET revoked_at = clock_timestamp()
  WHERE ledger.family = 'canonical_detail' AND ledger.applied_at IS NULL AND ledger.revoked_at IS NULL
    AND ledger.target_date IN (
      SELECT service_date FROM new_rows UNION SELECT service_date FROM old_rows
    );
  RETURN NULL;
END
$function$;
"""
          new_update_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_update_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
DECLARE
  affected_date date;
BEGIN
  FOR affected_date IN
    SELECT service_date FROM new_rows UNION SELECT service_date FROM old_rows
  LOOP
    PERFORM analytics.mark_dirty(affected_date, 'canonical-update');
  END LOOP;
  RETURN NULL;
END
$function$;
"""
          if new_update_trigger not in sql:
              if old_update_trigger not in sql:
                  raise SystemExit('update dirty trigger anchor missing')
              sql = sql.replace(old_update_trigger, new_update_trigger, 1)

          migration.write_text(sql)
          PY
          git diff --check
          sha256sum migrations/0006_aggregation_retention.sql
      - name: Commit materialized milestone 4 invariants
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/postgres.test.ts migrations/0006_aggregation_retention.sql
          if git diff --cached --quiet; then
            echo 'Milestone 4 invariants already current.'
          else
            git commit -m 'fix: invalidate open-month aggregates on canonical repair'
            git pull --rebase origin feature-milestone-4
            git push origin HEAD:feature-milestone-4
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  postgres-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-image:
          - postgres:16.14-bookworm
          - postgres:18.4-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Migration, static/realtime persistence, replay, role security, doctor, analytics, and retention contract
        run: ./scripts/postgres-contract.sh "${{ matrix.postgres-image }}"

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 and arm64 OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/atodotren-worker-multiarch.tar

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/compose-smoke.sh example.env

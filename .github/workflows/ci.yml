name: Milestone 5 CI

on:
  push:
    branches:
      - main
      - feature-milestone-5
  pull_request:

permissions:
  contents: read

concurrency:
  group: milestone-5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0
  MILESTONE4_BASE: 0563dcaa9c9c1d9d7bea3596e3ccaf8b4f0d58b6

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        run: git diff --check "$MILESTONE4_BASE"...HEAD
      - name: Prove migrations 0001-0008 are immutable
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code "$MILESTONE4_BASE" -- \
            migrations/0001_repository_foundation.sql \
            migrations/0002_static_madrid_foundation.sql \
            migrations/0003_static_mapping_integrity.sql \
            migrations/0004_realtime_ingestion.sql \
            migrations/0005_canonical_journeys.sql \
            migrations/0006_aggregation_retention.sql \
            migrations/0007_m4_correctness_gates.sql \
            migrations/0008_timetable_metric_identity.sql
          sha256sum migrations/000{1,2,3,4,5,6,7,8}_*.sql
      - name: Reject credential-bearing tracked artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -Eq '(^|/)\.env$|(^|/)(id_rsa|id_ed25519)$'; then
            echo 'Credential-bearing artifact is tracked.' >&2
            exit 1
          fi
          if git grep -En '[0-9]{8,12}:[A-Za-z0-9_-]{30,}' -- ':!package-lock.json'; then
            echo 'A Telegram-token-shaped value is present in tracked source.' >&2
            exit 1
          fi
      - name: Reject temporary acceptance monitor traces
        shell: bash
        run: |
          set -Eeuo pipefail
          monitor_path="scripts/pi-resource-$(printf '%s' monitor).sh"
          monitor_name="$(basename "$monitor_path")"
          if git ls-files | grep -Fx "$monitor_path"; then
            echo 'Temporary Pi resource monitor is still present in the current tree.' >&2
            exit 1
          fi
          if git grep -n --fixed-strings "$monitor_name" -- README.md MVP_IMPLEMENTATION_PLAN.md example.env compose.yaml compose.smoke.yaml scripts; then
            echo 'Temporary Pi resource monitor is still referenced in current documentation/configuration.' >&2
            exit 1
          fi
      - name: Check Telegram ownership and forbidden deployment surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          worker_block="$(sed -n '/^  worker:/,/^  telegram-ops:/p' compose.yaml | sed '$d')"
          telegram_block="$(sed -n '/^  telegram-ops:/,/^volumes:/p' compose.yaml | sed '$d')"
          if grep -Eq 'TELEGRAM_BOT_TOKEN|TELEGRAM_PRIVATE_CHAT_ID|TELEGRAM_ALLOWED_USER_ID' <<<"$worker_block"; then
            echo 'The ingestion worker must not receive Telegram credentials.' >&2
            exit 1
          fi
          if grep -q 'createTelegramTransport' apps/worker/src/dispatcher.ts; then
            echo 'The ingestion worker must not own a Telegram sender transport.' >&2
            exit 1
          fi
          if grep -Eq 'docker\.sock|privileged:|^[[:space:]]+ports:' <<<"$telegram_block"; then
            echo 'Telegram operations service exposes a forbidden privileged/network surface.' >&2
            exit 1
          fi

  materialize-readme-cleanup:
    name: CI-only final README cleanup
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    needs: repository-contract
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-5
          fetch-depth: 0
      - name: Align Telegram ownership documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          old_one = '''`HEARTBEAT_URL` is optional and is called only after a successful fetch plus
durable PostgreSQL or spool persistence. Telegram (`TELEGRAM_BOT_TOKEN` plus
`TELEGRAM_CHAT_ID`) and SMTP (`SMTP_HOST`, `SMTP_FROM`, `SMTP_TO`, with optional
credentials) are independent. Each incident key is a sequence of independent
episodes. An episode normally sends ACTIVE once after three consecutive bad
observations; a pending episode that recovers earlier closes silently. RECOVERY is
sent once, and only through channels that delivered ACTIVE for that episode. A
new episode starts at occurrence one without inheriting prior notification state.
Partial delivery is tracked per channel in the running worker, so a successful
Telegram delivery is not repeated while only a failed SMTP delivery is retried.
`heartbeat.failure` covers failed delivery attempts and is observed healthy after
the next successful delivery; `heartbeat.stale` separately covers elapsed time
without a success. Ordinary tests use fake transports and never send messages.
'''
          new_one = '''`HEARTBEAT_URL` is optional and is called only after a successful fetch plus
durable PostgreSQL or spool persistence. SMTP (`SMTP_HOST`, `SMTP_FROM`, `SMTP_TO`,
with optional credentials) remains an optional worker-owned delivery channel. The
ingestion worker never receives Telegram credentials or calls the Telegram Bot API;
it persists incident facts only. `telegram-ops` reads those facts and exclusively
owns Telegram ACTIVE/RECOVERY delivery through its durable delivery ledger. Each
incident key remains a sequence of independent episodes. `heartbeat.failure` covers
failed delivery attempts and is observed healthy after the next successful delivery;
`heartbeat.stale` separately covers elapsed time without a success. Ordinary tests
use fake transports and never send messages.
'''
          if text.count(old_one) != 1:
              raise SystemExit(f'expected first legacy alert block once, found {text.count(old_one)}')
          text = text.replace(old_one, new_one)

          old_two = '''Incident metadata failures and channel failures emit credential-safe structured
`notification.*_failed` events while durable RENFE ingestion continues. Per-channel
delivery state is retained while failed database markers retry on later
observations; zero-row state updates are treated as failures. Retry state remains
process-local: a crash after a channel send but before its database marker can
rarely duplicate that delivery. A durable per-channel outbox is deferred to
Milestone 6.
'''
          new_two = '''Ingestion incident persistence failures plus worker-owned SMTP/heartbeat failures
emit credential-safe structured events while durable RENFE ingestion continues.
Telegram delivery failures belong to `telegram-ops`; its bounded PostgreSQL state
tracks attempts and successful message IDs without retaining message bodies, rendered
reports, chart bytes, Bot API responses, or credentials.
'''
          if text.count(old_two) != 1:
              raise SystemExit(f'expected second legacy alert block once, found {text.count(old_two)}')
          text = text.replace(old_two, new_two)

          old_three = '''Explicitly test the configured real channels from the built Compose worker only
when sending a labelled test message and heartbeat is intended:

```sh
docker compose --env-file .env run --rm --no-deps worker \\
  test-notifications --confirm-send
```

The command reports Telegram, SMTP, and heartbeat as delivered, failed, or
skipped and exits nonzero if a configured channel fails. It never creates an
operational incident or prints credentials. `ATODOTREN_NOTIFICATION_TEST=1` is an
alternative explicit opt-in; the command refuses to send without one of these
confirmations.
'''
          new_three = '''Explicitly test the worker-owned real SMTP/heartbeat channels from the built
Compose worker only when a labelled test and heartbeat call are intended:

```sh
docker compose --env-file .env run --rm --no-deps worker \\
  test-notifications --confirm-send
```

The worker command never sends Telegram in Milestone 5. It exits nonzero if a
configured worker-owned channel fails, never creates an operational incident, and
never prints credentials. `ATODOTREN_NOTIFICATION_TEST=1` is an alternative explicit
opt-in. Real Telegram delivery is validated separately during the `telegram-ops` Pi
acceptance phase.
'''
          if text.count(old_three) != 1:
              raise SystemExit(f'expected legacy notification-test block once, found {text.count(old_three)}')
          text = text.replace(old_three, new_three)

          if 'Partial delivery is tracked per channel in the running worker' in text:
              raise SystemExit('legacy worker Telegram retry wording remains')
          path.write_text(text)
          PY
          git diff --check
      - name: Commit docs and restore clean workflow tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/m5-readme-final-cleanup.yml
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/ci.yml
          git commit -m 'docs: align milestone 5 Telegram ownership'
          git push origin HEAD:feature-milestone-5

  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    needs: repository-contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  postgres-contract:
    name: PostgreSQL ${{ matrix.postgres }} contract
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - postgres:16.14-bookworm
          - postgres:18.4-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: ./scripts/postgres-contract.sh '${{ matrix.postgres }}'

  docker-build:
    name: Docker amd64 build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        run: docker build --file docker/worker/Dockerfile --tag atodotren-worker:ci .
      - name: Prove fake Telegram fixture is not in production image
        run: docker run --rm --entrypoint sh atodotren-worker:ci -c 'test ! -e /app/tests/fixtures/fake-telegram-server.mjs'

  docker-multiarch:
    name: Docker amd64/arm64 build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both supported architectures
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file docker/worker/Dockerfile
          --output type=oci,dest=/tmp/atodotren-worker-multiarch.tar
          .

  compose-smoke:
    name: Compose fake-Telegram smoke
    runs-on: ubuntu-latest
    needs:
      - postgres-contract
      - docker-build
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/compose-smoke.sh example.env

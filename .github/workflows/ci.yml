name: Milestone 1 CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  postgres-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-image:
          - postgres:16.14-bookworm
          - postgres:18.4-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Migration, static fixture import, activation, role security, and doctor contract
        run: ./scripts/postgres-contract.sh "${{ matrix.postgres-image }}"

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 and arm64 OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/atodotren-worker-multiarch.tar

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/compose-smoke.sh example.env

name: Repository CI

on:
  push:
    branches:
      - main
      - feature-milestone-5
      - feature/frontend-alpha
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0
  MILESTONE4_BASE: 0563dcaa9c9c1d9d7bea3596e3ccaf8b4f0d58b6
  FRONTEND_BASE: 2811eff0632e62cf512480a4ccfa432a01e91ede

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        run: git diff --check "$FRONTEND_BASE"...HEAD
      - name: Prove accepted migrations are immutable
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code "$MILESTONE4_BASE" -- \
            migrations/0001_repository_foundation.sql \
            migrations/0002_static_madrid_foundation.sql \
            migrations/0003_static_mapping_integrity.sql \
            migrations/0004_realtime_ingestion.sql \
            migrations/0005_canonical_journeys.sql \
            migrations/0006_aggregation_retention.sql \
            migrations/0007_m4_correctness_gates.sql \
            migrations/0008_timetable_metric_identity.sql
          git diff --exit-code "$FRONTEND_BASE" -- \
            migrations/0001_repository_foundation.sql \
            migrations/0002_static_madrid_foundation.sql \
            migrations/0003_static_mapping_integrity.sql \
            migrations/0004_realtime_ingestion.sql \
            migrations/0005_canonical_journeys.sql \
            migrations/0006_aggregation_retention.sql \
            migrations/0007_m4_correctness_gates.sql \
            migrations/0008_timetable_metric_identity.sql \
            migrations/0009_reporting_telegram.sql \
            migrations/0010_realtime_service_date_recovery.sql \
            migrations/0011_isolated_maintenance_finalization.sql \
            migrations/0012_telegram_reporting_corrections.sql
          sha256sum migrations/00{01,02,03,04,05,06,07,08,09,10,11,12}_*.sql
      - name: Reject credential-bearing tracked artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -Eq '(^|/)\.env$|(^|/)(id_rsa|id_ed25519)$'; then
            echo 'Credential-bearing artifact is tracked.' >&2
            exit 1
          fi
          if git grep -En '[0-9]{8,12}:[A-Za-z0-9_-]{30,}' -- ':!package-lock.json'; then
            echo 'A Telegram-token-shaped value is present in tracked source.' >&2
            exit 1
          fi
      - name: Reject temporary acceptance monitor traces
        shell: bash
        run: |
          set -Eeuo pipefail
          monitor_path="scripts/pi-resource-$(printf '%s' monitor).sh"
          monitor_name="$(basename "$monitor_path")"
          if git ls-files | grep -Fx "$monitor_path"; then
            echo 'Temporary Pi resource monitor is still present in the current tree.' >&2
            exit 1
          fi
          if git grep -n --fixed-strings "$monitor_name" -- README.md MVP_IMPLEMENTATION_PLAN.md example.env compose.yaml compose.smoke.yaml scripts; then
            echo 'Temporary Pi resource monitor is still referenced in current documentation/configuration.' >&2
            exit 1
          fi
      - name: Check Telegram ownership and forbidden deployment surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          worker_block="$(sed -n '/^  worker:/,/^  telegram-ops:/p' compose.yaml | sed '$d')"
          telegram_block="$(sed -n '/^  telegram-ops:/,/^volumes:/p' compose.yaml | sed '$d')"
          if grep -Eq 'TELEGRAM_BOT_TOKEN|TELEGRAM_PRIVATE_CHAT_ID|TELEGRAM_ALLOWED_USER_ID' <<<"$worker_block"; then
            echo 'The ingestion worker must not receive Telegram credentials.' >&2
            exit 1
          fi
          if grep -q 'createTelegramTransport' apps/worker/src/dispatcher.ts; then
            echo 'The ingestion worker must not own a Telegram sender transport.' >&2
            exit 1
          fi
          if grep -Eq 'docker\.sock|privileged:|^[[:space:]]+ports:' <<<"$telegram_block"; then
            echo 'Telegram operations service exposes a forbidden privileged/network surface.' >&2
            exit 1
          fi
          if git grep -En 'TELEGRAM_ALERT_(MATCHING|MALFORMED)' -- example.env compose.yaml compose.smoke.yaml apps packages; then
            echo 'Removed duplicate Telegram matching/malformed detection settings are referenced by runtime/configuration.' >&2
            exit 1
          fi

  lockfile-contract:
    name: npm lockfile contract
    runs-on: ubuntu-latest
    needs: repository-contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Regenerate lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated lockfile for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1
      - name: Require committed lockfile to be current
        run: git diff --exit-code -- package-lock.json

  verify:
    name: Worker typecheck, lint and unit tests
    runs-on: ubuntu-latest
    needs:
      - repository-contract
      - lockfile-contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  web-verify:
    name: Web typecheck, lint, unit and production build
    runs-on: ubuntu-latest
    needs:
      - repository-contract
      - lockfile-contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run web:typecheck
      - run: npm run web:lint
      - run: npm run web:test
      - name: Build Next.js production bundle in private fixture preview mode
        run: npm run web:build
        env:
          WEB_DATA_MODE: fixture
          WEB_ALLOW_FIXTURE_PRODUCTION: "true"

  postgres-contract:
    name: PostgreSQL ${{ matrix.postgres }} worker + public web contracts
    runs-on: ubuntu-latest
    needs:
      - verify
      - web-verify
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - postgres:16.14-bookworm
          - postgres:18.4-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: ./scripts/postgres-contract.sh '${{ matrix.postgres }}'

  web-browser:
    name: Playwright / ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: web-verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Desktop Chromium
            project: desktop-chromium
            browser: chromium
            artifact: desktop-chromium
          - label: Mobile Chromium
            project: mobile-chromium
            browser: chromium
            artifact: mobile-chromium
          - label: WebKit acceptance
            project: webkit-acceptance
            browser: webkit
            artifact: webkit-acceptance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }} browser runtime
        run: npx playwright install --with-deps '${{ matrix.browser }}'
      - name: Run ${{ matrix.label }} acceptance tests
        run: npm run test:e2e --workspace @atodotren/web -- --project='${{ matrix.project }}'
      - name: Upload ${{ matrix.label }} inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/web/test-results/screenshots/*.png
            apps/web/test-results/**/trace.zip
            apps/web/playwright-report/**

  docker-build:
    name: Worker Docker amd64 build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        run: docker build --file docker/worker/Dockerfile --tag atodotren-worker:ci .
      - name: Prove fake Telegram fixture is not in production image
        run: docker run --rm --entrypoint sh atodotren-worker:ci -c 'test ! -e /app/tests/fixtures/fake-telegram-server.mjs'

  docker-multiarch:
    name: Worker Docker amd64/arm64 build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both supported architectures
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file docker/worker/Dockerfile
          --output type=oci,dest=/tmp/atodotren-worker-multiarch.tar
          .

  web-docker-build:
    name: Web Docker amd64 build
    runs-on: ubuntu-latest
    needs: web-verify
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build standalone web image
        run: docker build --file docker/web/Dockerfile --tag atodotren-web:ci .
      - name: Smoke fixture runtime without database access
        run: >-
          docker run --rm -d --name atodotren-web-ci -p 127.0.0.1:3100:3000
          -e WEB_DATA_MODE=fixture -e WEB_ALLOW_FIXTURE_PRODUCTION=true atodotren-web:ci
          && for i in {1..30}; do curl --fail --silent http://127.0.0.1:3100/es >/dev/null && break; sleep 1; done
          && curl --fail http://127.0.0.1:3100/es
          && docker rm -f atodotren-web-ci

  web-docker-multiarch:
    name: Web Docker amd64/arm64 build
    runs-on: ubuntu-latest
    needs: web-verify
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build both supported architectures
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file docker/web/Dockerfile
          --output type=oci,dest=/tmp/atodotren-web-multiarch.tar
          .

  compose-smoke:
    name: Compose fake-Telegram smoke
    runs-on: ubuntu-latest
    needs:
      - postgres-contract
      - docker-build
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/compose-smoke.sh example.env

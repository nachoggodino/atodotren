name: Materialize Milestone 5 typecheck fixes

on:
  push:
    branches: [feature-milestone-5]
    paths: [.github/workflows/m5-typecheck-fix.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-5
      - name: Apply strict TypeScript fixes reported by CI
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'apps/worker/src/resources.ts': [
              ("  #previousHostCpu?: { readonly idle: number; readonly total: number };",
               "  #previousHostCpu: { readonly idle: number; readonly total: number } | undefined;"),
            ],
            'apps/worker/src/telegram-commands.ts': [
              ("  const name = commandMatch[1];", "  const name = commandMatch[1] ?? '';"),
              ("  const candidates = await reporting.lineCandidates(command.query);\n  const selected = exactOrUnique(candidates);\n  if (selected === null) return candidateResponse('line', candidates, null, state, true);",
               "  if (command.name !== 'trains') throw new Error('Command routing reached an impossible state');\n  const candidates = await reporting.lineCandidates(command.query);\n  const selected = exactOrUnique(candidates);\n  if (selected === null) return candidateResponse('line', candidates, null, state, true);"),
            ],
            'apps/worker/src/telegram-operations.ts': [
              ("    const sent = await options.telegram.sendMessage(options.config.privateChatId ?? '', text, { buttons: response.buttons }, options.signal);",
               "    const sent = await options.telegram.sendMessage(options.config.privateChatId ?? '', text, response.buttons === undefined ? {} : { buttons: response.buttons }, options.signal);"),
            ],
            'apps/worker/src/telegram-state.ts': [
              ("type PoolClient = Awaited<ReturnType<Pool['connect']>>;\n", ""),
            ],
            'apps/worker/src/telegram-transport.ts': [
              ("  public readonly errorCode?: number;", "  public readonly errorCode: number | undefined;"),
            ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {filename}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Remove materializer and commit
        run: |
          git rm .github/workflows/m5-typecheck-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src
          git commit -m 'fix: satisfy milestone 5 strict type contracts'
          git push origin HEAD:feature-milestone-5

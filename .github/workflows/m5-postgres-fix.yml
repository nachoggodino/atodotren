name: Milestone 5 PostgreSQL remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-5
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Apply PostgreSQL remediation
        run: python3 scripts/m5-postgres-remediate.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: PostgreSQL 16.14 contract
        run: ./scripts/postgres-contract.sh postgres:16.14-bookworm
      - name: PostgreSQL 18.4 contract
        run: ./scripts/postgres-contract.sh postgres:18.4-bookworm
      - run: git diff --check
      - name: Commit only verified remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm scripts/m5-postgres-remediate.py .github/workflows/m5-postgres-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align milestone 5 PostgreSQL contracts'
          git push origin HEAD:feature-milestone-5

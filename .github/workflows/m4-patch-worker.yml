name: M4 Patch Worker

on:
  push:
    branches:
      - feature-milestone-4
    paths:
      - '.github/workflows/m4-patch-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
      - name: Patch worker dispatcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/dispatcher.ts')
          text = path.read_text()

          anchor = "import { createLogger, createShutdownManager } from '@atodotren/observability';\n"
          addition = """import {\n  aggregateDirty,\n  DEFAULT_AGGREGATE_ALGORITHM_VERSION,\n  finalizeAnalytics,\n  RETENTION_CONFIRMATION,\n  type RetentionMode,\n} from './analytics.js';\n"""
          if addition not in text:
              text = text.replace(anchor, anchor + addition)

          text = text.replace(
              "  aggregate       Recompute dirty aggregate buckets (planned for a later milestone)\n  finalize        Finalize eligible service days (planned for a later milestone)\n",
              "  aggregate       Recompute bounded dirty daily aggregate scopes\n  finalize        Verify service days, seal months, and plan/apply retention\n",
          )
          text = text.replace(
              "bounded canonicalization and closure after every polling cycle.\n`;",
              "bounded canonicalization and closure after every polling cycle, plus dirty aggregate\nmaintenance on a five-minute cadence.\n`;",
          )

          usage_anchor = """export class UsageError extends Error {\n"""
          usages = r"""export const aggregateUsage = `Usage:
  worker aggregate [--service-date <YYYY-MM-DD>] [--limit <1-500>] [--algorithm-version <version>]

Recomputes daily aggregate scopes from canonical source rows using deterministic
replacement semantics. With no date, the oldest dirty scopes are processed first.
Every invocation emits one bounded JSON report.
`;

export const finalizeUsage = `Usage:
  worker finalize [--service-date <YYYY-MM-DD>] [--month <YYYY-MM-01>] [--limit <1-200>]
    [--algorithm-version <version>] [--now <ISO-instant>] [--grace-seconds <0-86400>]
    [--month-grace-hours <0-168>] [--retention | --authorize-retention |
     --apply-retention --confirm-retention DROP-VERIFIED-PARTITIONS]
    [--live-state-grace-seconds <0-86400>]

Finalization verifies canonical closure, aggregate denominators, versions and
checksums before creating replaceable schedule contributions. Month sealing merges
those contributions only after its grace. --retention is a non-destructive dry run;
--authorize-retention writes ledger authorization but never deletes; --apply-retention
requires the literal confirmation above and only drops already-authorized known
partitions. Every invocation is bounded and emits JSON.
`;

"""
          if usages not in text:
              text = text.replace(usage_anchor, usages + usage_anchor)

          dep_anchor = "  readonly closeJourneys?: typeof closeJourneys;\n"
          dep_add = "  readonly aggregate?: typeof aggregateDirty;\n  readonly finalize?: typeof finalizeAnalytics;\n"
          if dep_add not in text:
              text = text.replace(dep_anchor, dep_anchor + dep_add)

          insertion_anchor = "interface ImportStaticCliOptions {\n"
          implementation = r"""interface AggregateCliOptions {
  readonly serviceDate?: string;
  readonly limit?: number;
  readonly algorithmVersion: string;
  readonly help: boolean;
}

interface FinalizeCliOptions {
  readonly serviceDate?: string;
  readonly month?: string;
  readonly limit?: number;
  readonly algorithmVersion: string;
  readonly now?: Date;
  readonly graceSeconds?: number;
  readonly monthGraceHours?: number;
  readonly retentionMode: RetentionMode;
  readonly liveStateGraceSeconds?: number;
  readonly help: boolean;
}

function boundedCliInteger(
  value: string | undefined,
  name: string,
  minimum: number,
  maximum: number,
  usage: string,
): number | undefined {
  if (value === undefined) return undefined;
  const parsed = Number(value);
  if (!Number.isSafeInteger(parsed) || parsed < minimum || parsed > maximum) {
    throw new UsageError(`${name} must be an integer from ${minimum} through ${maximum}`, usage);
  }
  return parsed;
}

function aggregateAlgorithmVersion(value: string | undefined, usage: string): string {
  const version = value ?? DEFAULT_AGGREGATE_ALGORITHM_VERSION;
  if (!/^[a-z0-9_.-]{1,40}$/u.test(version)) throw new UsageError('Invalid --algorithm-version', usage);
  return version;
}

function parseAggregateOptions(arguments_: readonly string[]): AggregateCliOptions {
  let parsed;
  try {
    parsed = parseArgs({
      args: [...arguments_], allowPositionals: false, strict: true,
      options: {
        'service-date': { type: 'string' }, limit: { type: 'string' },
        'algorithm-version': { type: 'string' }, help: { type: 'boolean', short: 'h' },
      },
    });
  } catch (error) {
    throw new UsageError(error instanceof Error ? error.message : 'Invalid aggregate options', aggregateUsage);
  }
  if (parsed.values.help === true) return {
    algorithmVersion: DEFAULT_AGGREGATE_ALGORITHM_VERSION, help: true,
  };
  const serviceDate = parsed.values['service-date'];
  if (serviceDate !== undefined && !/^\d{4}-\d{2}-\d{2}$/u.test(serviceDate)) {
    throw new UsageError('--service-date must use YYYY-MM-DD', aggregateUsage);
  }
  return {
    ...(serviceDate === undefined ? {} : { serviceDate }),
    ...(parsed.values.limit === undefined ? {} : {
      limit: boundedCliInteger(parsed.values.limit, '--limit', 1, 500, aggregateUsage),
    }),
    algorithmVersion: aggregateAlgorithmVersion(parsed.values['algorithm-version'], aggregateUsage),
    help: false,
  };
}

function parseFinalizeOptions(arguments_: readonly string[]): FinalizeCliOptions {
  let parsed;
  try {
    parsed = parseArgs({
      args: [...arguments_], allowPositionals: false, strict: true,
      options: {
        'service-date': { type: 'string' }, month: { type: 'string' }, limit: { type: 'string' },
        'algorithm-version': { type: 'string' }, now: { type: 'string' },
        'grace-seconds': { type: 'string' }, 'month-grace-hours': { type: 'string' },
        retention: { type: 'boolean' }, 'authorize-retention': { type: 'boolean' },
        'apply-retention': { type: 'boolean' }, 'confirm-retention': { type: 'string' },
        'live-state-grace-seconds': { type: 'string' }, help: { type: 'boolean', short: 'h' },
      },
    });
  } catch (error) {
    throw new UsageError(error instanceof Error ? error.message : 'Invalid finalize options', finalizeUsage);
  }
  if (parsed.values.help === true) return {
    algorithmVersion: DEFAULT_AGGREGATE_ALGORITHM_VERSION, retentionMode: 'none', help: true,
  };
  const serviceDate = parsed.values['service-date'];
  const month = parsed.values.month;
  if (serviceDate !== undefined && !/^\d{4}-\d{2}-\d{2}$/u.test(serviceDate)) {
    throw new UsageError('--service-date must use YYYY-MM-DD', finalizeUsage);
  }
  if (month !== undefined && !/^\d{4}-\d{2}-01$/u.test(month)) {
    throw new UsageError('--month must use YYYY-MM-01', finalizeUsage);
  }
  const retentionFlags = [parsed.values.retention, parsed.values['authorize-retention'], parsed.values['apply-retention']]
    .filter((value) => value === true).length;
  if (retentionFlags > 1) throw new UsageError('Retention modes are mutually exclusive', finalizeUsage);
  let retentionMode: RetentionMode = 'none';
  if (parsed.values.retention === true) retentionMode = 'plan';
  if (parsed.values['authorize-retention'] === true) retentionMode = 'authorize';
  if (parsed.values['apply-retention'] === true) retentionMode = 'apply';
  if (retentionMode === 'apply' && parsed.values['confirm-retention'] !== RETENTION_CONFIRMATION) {
    throw new UsageError(`--apply-retention requires --confirm-retention ${RETENTION_CONFIRMATION}`, finalizeUsage);
  }
  if (retentionMode !== 'apply' && parsed.values['confirm-retention'] !== undefined) {
    throw new UsageError('--confirm-retention is only valid with --apply-retention', finalizeUsage);
  }
  let now: Date | undefined;
  if (parsed.values.now !== undefined) {
    now = new Date(parsed.values.now);
    if (Number.isNaN(now.getTime())) throw new UsageError('--now must be an ISO instant', finalizeUsage);
  }
  return {
    ...(serviceDate === undefined ? {} : { serviceDate }), ...(month === undefined ? {} : { month }),
    ...(parsed.values.limit === undefined ? {} : {
      limit: boundedCliInteger(parsed.values.limit, '--limit', 1, 200, finalizeUsage),
    }),
    algorithmVersion: aggregateAlgorithmVersion(parsed.values['algorithm-version'], finalizeUsage),
    ...(now === undefined ? {} : { now }),
    ...(parsed.values['grace-seconds'] === undefined ? {} : {
      graceSeconds: boundedCliInteger(parsed.values['grace-seconds'], '--grace-seconds', 0, 86_400, finalizeUsage),
    }),
    ...(parsed.values['month-grace-hours'] === undefined ? {} : {
      monthGraceHours: boundedCliInteger(parsed.values['month-grace-hours'], '--month-grace-hours', 0, 168, finalizeUsage),
    }),
    ...(parsed.values['live-state-grace-seconds'] === undefined ? {} : {
      liveStateGraceSeconds: boundedCliInteger(
        parsed.values['live-state-grace-seconds'], '--live-state-grace-seconds', 0, 86_400, finalizeUsage,
      ),
    }),
    retentionMode, help: false,
  };
}

export async function runAggregateCommand(
  options: AggregateCliOptions,
  dependencies: DispatcherDependencies = {},
): Promise<0 | 1> {
  const config = loadConfig(dependencies.environment ?? process.env);
  const connection = await (dependencies.connect ?? createDatabaseConnection)(config.database);
  try {
    const report = await (dependencies.aggregate ?? aggregateDirty)({
      pool: connection.pool, algorithmVersion: options.algorithmVersion,
      ...(options.serviceDate === undefined ? {} : { serviceDate: options.serviceDate }),
      ...(options.limit === undefined ? {} : { limit: options.limit }),
    });
    (dependencies.stdout ?? process.stdout).write(`${JSON.stringify(report)}\n`);
    return report.failed === 0 ? 0 : 1;
  } finally {
    await connection.close();
  }
}

export async function runFinalizeCommand(
  options: FinalizeCliOptions,
  dependencies: DispatcherDependencies = {},
): Promise<0 | 1> {
  const config = loadConfig(dependencies.environment ?? process.env);
  const connection = await (dependencies.connect ?? createDatabaseConnection)(config.database);
  try {
    const report = await (dependencies.finalize ?? finalizeAnalytics)({
      pool: connection.pool, algorithmVersion: options.algorithmVersion,
      ...(options.serviceDate === undefined ? {} : { serviceDate: options.serviceDate }),
      ...(options.month === undefined ? {} : { month: options.month }),
      ...(options.limit === undefined ? {} : { limit: options.limit }),
      ...(options.now === undefined ? {} : { now: options.now }),
      ...(options.graceSeconds === undefined ? {} : { graceSeconds: options.graceSeconds }),
      ...(options.monthGraceHours === undefined ? {} : { monthGraceHours: options.monthGraceHours }),
      ...(options.liveStateGraceSeconds === undefined ? {} : { liveStateGraceSeconds: options.liveStateGraceSeconds }),
      retentionMode: options.retentionMode,
    });
    (dependencies.stdout ?? process.stdout).write(`${JSON.stringify(report)}\n`);
    return report.errors.length === 0 ? 0 : 1;
  } finally {
    await connection.close();
  }
}

"""
          if implementation not in text:
              text = text.replace(insertion_anchor, implementation + insertion_anchor)

          ingest_anchor = "    const report = await (dependencies.ingest ?? runIngest)({\n"
          if "let nextAggregateMaintenanceAt" not in text:
              text = text.replace(
                  ingest_anchor,
                  "    let nextAggregateMaintenanceAt = Date.now() + 5 * 60_000;\n" + ingest_anchor,
              )
          closure_anchor = """          logger.info('canonical.maintenance', 'Canonical maintenance completed', {
            journeysCreated: canonical.journeysCreated,
            journeysUpdated: canonical.journeysUpdated,
            journeysClosed: canonical.journeysClosed + closed.journeysClosed,
            journeyStopsMaterialized: canonical.journeyStopsMaterialized,
          });
"""
          closure_add = """          const maintenanceNow = Date.now();
          if (maintenanceNow >= nextAggregateMaintenanceAt) {
            const aggregate = await (dependencies.aggregate ?? aggregateDirty)({ pool: canonicalPool, limit: 20 });
            if (aggregate.failed > 0) throw new Error('Aggregate maintenance reported bounded errors');
            nextAggregateMaintenanceAt = maintenanceNow + 5 * 60_000;
            logger.info('aggregate.maintenance', 'Aggregate maintenance completed', {
              scopesAttempted: aggregate.scopesAttempted,
              succeeded: aggregate.succeeded,
              noops: aggregate.noops,
            });
          }
"""
          if closure_add not in text:
              text = text.replace(closure_anchor, closure_anchor + closure_add)

          dispatch_anchor = """  if (first === 'replay') {
"""
          dispatch_add = """  if (first === 'aggregate') {
    const options = parseAggregateOptions(commandArguments);
    if (options.help) {
      stdout.write(aggregateUsage);
      return 0;
    }
    return runAggregateCommand(options, dependencies);
  }
  if (first === 'finalize') {
    const options = parseFinalizeOptions(commandArguments);
    if (options.help) {
      stdout.write(finalizeUsage);
      return 0;
    }
    return runFinalizeCommand(options, dependencies);
  }
"""
          if dispatch_add not in text:
              text = text.replace(dispatch_anchor, dispatch_add + dispatch_anchor)

          path.write_text(text)
          PY
      - name: Commit worker integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/dispatcher.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: expose milestone 4 aggregate and finalize commands'
            git push origin HEAD:feature-milestone-4
          fi

name: Frontend lockfile bootstrap

on:
  push:
    branches:
      - feature/frontend-alpha

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/frontend-alpha
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Generate lockfile with pinned npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(web): refresh frontend lockfile'
          git push origin HEAD:feature/frontend-alpha

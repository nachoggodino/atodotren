name: M4 Materialize And Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-and-gate:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
          fetch-depth: 0

      - name: Materialize Milestone 4 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('migrations/0006_aggregation_retention.sql')
          sql = migration.read_text()

          old_mark_dirty = """  UPDATE operations.retention_ledger
  SET revoked_at = clock_timestamp()
  WHERE family = 'canonical_detail' AND target_date = analytics.mark_dirty.target_date
    AND applied_at IS NULL AND revoked_at IS NULL;
END
$function$;
"""
          new_mark_dirty = """  UPDATE operations.retention_ledger
  SET revoked_at = clock_timestamp()
  WHERE family = 'canonical_detail' AND target_date = analytics.mark_dirty.target_date
    AND applied_at IS NULL AND revoked_at IS NULL;

  -- Open-month schedule contributions are replaceable. If this aggregate version
  -- has already sealed the calendar month, preserve its verification and monthly
  -- rows; a repair must then use a newer aggregate algorithm version.
  DELETE FROM analytics.daily_schedule_contribution AS contribution
  USING operations.service_day_finalization AS finalization
  WHERE contribution.service_date = analytics.mark_dirty.target_date
    AND finalization.service_date = contribution.service_date
    AND finalization.aggregate_algorithm_version = contribution.aggregate_algorithm_version
    AND NOT EXISTS (
      SELECT 1 FROM operations.month_seal AS seal
      WHERE seal.calendar_month = date_trunc('month', contribution.service_date)::date
        AND seal.aggregate_algorithm_version = contribution.aggregate_algorithm_version
        AND seal.status = 'sealed'
    );

  DELETE FROM operations.service_day_finalization AS finalization
  WHERE finalization.service_date = analytics.mark_dirty.target_date
    AND NOT EXISTS (
      SELECT 1 FROM operations.month_seal AS seal
      WHERE seal.calendar_month = date_trunc('month', finalization.service_date)::date
        AND seal.aggregate_algorithm_version = finalization.aggregate_algorithm_version
        AND seal.status = 'sealed'
    );
END
$function$;
"""
          if new_mark_dirty not in sql:
              if old_mark_dirty not in sql:
                  raise SystemExit('mark_dirty anchor missing')
              sql = sql.replace(old_mark_dirty, new_mark_dirty, 1)

          aggregate_anchor = """  PERFORM pg_advisory_xact_lock(hashtextextended('aggregate:daily:' || target_date::text, 0));

  DELETE FROM analytics.daily_stop_call_hour WHERE service_date = target_date;
"""
          aggregate_guard = """  PERFORM pg_advisory_xact_lock(hashtextextended('aggregate:daily:' || target_date::text, 0));

  IF EXISTS (
    SELECT 1 FROM operations.month_seal
    WHERE calendar_month = date_trunc('month', target_date)::date
      AND aggregate_algorithm_version = algorithm_version
      AND status = 'sealed'
  ) THEN
    SELECT count(*) INTO source_rows FROM core.journey_stop WHERE service_date = target_date;
    source_checksum_value := analytics.canonical_source_checksum(target_date);
    INSERT INTO analytics.aggregation_run (
      service_date, family, aggregate_algorithm_version, generation, started_at, completed_at,
      status, source_row_count, aggregate_row_count, source_checksum, blocker
    ) VALUES (
      target_date, 'daily', algorithm_version, dirty_generation, run_started, clock_timestamp(),
      'blocked', source_rows, 0, source_checksum_value, 'sealed_version_requires_new_algorithm'
    );
    RETURN jsonb_build_object(
      'serviceDate', target_date, 'status', 'blocked', 'sourceRows', source_rows,
      'aggregateRows', 0, 'sourceChecksum', source_checksum_value,
      'blocker', 'sealed_version_requires_new_algorithm'
    );
  END IF;

  DELETE FROM analytics.daily_stop_call_hour WHERE service_date = target_date;
"""
          if aggregate_guard not in sql:
              if aggregate_anchor not in sql:
                  raise SystemExit('recompute_daily anchor missing')
              sql = sql.replace(aggregate_anchor, aggregate_guard, 1)

          old_insert_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_insert_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
BEGIN
  INSERT INTO analytics.dirty_scope (service_date, family, reason)
  SELECT DISTINCT changed.service_date, family.value, 'canonical-insert'
  FROM new_rows AS changed
  CROSS JOIN (VALUES ('daily'::text), ('schedule'::text)) AS family(value)
  ON CONFLICT (service_date, family) DO UPDATE SET
    dirty_since = LEAST(analytics.dirty_scope.dirty_since, EXCLUDED.dirty_since),
    generation = analytics.dirty_scope.generation + 1,
    reason = EXCLUDED.reason;
  UPDATE operations.retention_ledger ledger
  SET revoked_at = clock_timestamp()
  WHERE ledger.family = 'canonical_detail' AND ledger.applied_at IS NULL AND ledger.revoked_at IS NULL
    AND ledger.target_date IN (SELECT DISTINCT service_date FROM new_rows);
  RETURN NULL;
END
$function$;
"""
          new_insert_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_insert_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
DECLARE
  affected_date date;
BEGIN
  FOR affected_date IN SELECT DISTINCT service_date FROM new_rows LOOP
    PERFORM analytics.mark_dirty(affected_date, 'canonical-insert');
  END LOOP;
  RETURN NULL;
END
$function$;
"""
          if new_insert_trigger not in sql:
              if old_insert_trigger not in sql:
                  raise SystemExit('insert dirty trigger anchor missing')
              sql = sql.replace(old_insert_trigger, new_insert_trigger, 1)

          old_update_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_update_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
BEGIN
  INSERT INTO analytics.dirty_scope (service_date, family, reason)
  SELECT DISTINCT changed.service_date, family.value, 'canonical-update'
  FROM (
    SELECT service_date FROM new_rows UNION SELECT service_date FROM old_rows
  ) AS changed
  CROSS JOIN (VALUES ('daily'::text), ('schedule'::text)) AS family(value)
  ON CONFLICT (service_date, family) DO UPDATE SET
    dirty_since = LEAST(analytics.dirty_scope.dirty_since, EXCLUDED.dirty_since),
    generation = analytics.dirty_scope.generation + 1,
    reason = EXCLUDED.reason;
  UPDATE operations.retention_ledger ledger
  SET revoked_at = clock_timestamp()
  WHERE ledger.family = 'canonical_detail' AND ledger.applied_at IS NULL AND ledger.revoked_at IS NULL
    AND ledger.target_date IN (
      SELECT service_date FROM new_rows UNION SELECT service_date FROM old_rows
    );
  RETURN NULL;
END
$function$;
"""
          new_update_trigger = """CREATE OR REPLACE FUNCTION analytics.mark_canonical_update_dirty()
RETURNS trigger
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = pg_catalog, analytics, operations
AS $function$
DECLARE
  affected_date date;
BEGIN
  FOR affected_date IN
    SELECT service_date FROM new_rows UNION SELECT service_date FROM old_rows
  LOOP
    PERFORM analytics.mark_dirty(affected_date, 'canonical-update');
  END LOOP;
  RETURN NULL;
END
$function$;
"""
          if new_update_trigger not in sql:
              if old_update_trigger not in sql:
                  raise SystemExit('update dirty trigger anchor missing')
              sql = sql.replace(old_update_trigger, new_update_trigger, 1)

          migration.write_text(sql)

          analytics = Path('apps/worker/src/analytics.ts')
          source = analytics.read_text()
          old_status = """      const report = jsonValue(result.rows[0]?.report);
      results.push(report);
      if (reportStatus(report) === 'noop') noops += 1;
      else succeeded += 1;
"""
          new_status = """      const report = jsonValue(result.rows[0]?.report);
      results.push(report);
      const status = reportStatus(report);
      if (status === 'noop') noops += 1;
      else if (status === 'succeeded') succeeded += 1;
      else errors.push(`${serviceDate}: aggregation ${status}`);
"""
          if new_status not in source:
              if old_status not in source:
                  raise SystemExit('aggregate result status anchor missing')
              source = source.replace(old_status, new_status, 1)
          analytics.write_text(source)

          inventory = Path('tests/integration/postgres.test.ts')
          tests = inventory.read_text()
          copy_0005 = """    cp(
      resolve(process.cwd(), 'migrations/0005_canonical_journeys.sql'),
      join(directory, '0005_canonical_journeys.sql'),
    ),
"""
          copy_0006 = """    cp(
      resolve(process.cwd(), 'migrations/0006_aggregation_retention.sql'),
      join(directory, '0006_aggregation_retention.sql'),
    ),
"""
          if copy_0006 not in tests:
              if copy_0005 not in tests:
                  raise SystemExit('migration inventory copy anchor missing')
              tests = tests.replace(copy_0005, copy_0005 + copy_0006, 1)
          tests = tests.replace(
              "        '0005_canonical_journeys.sql',\n      ]);",
              "        '0005_canonical_journeys.sql',\n        '0006_aggregation_retention.sql',\n      ]);",
          )
          inventory.write_text(tests)

          acceptance = Path('tests/integration/milestone4.test.ts')
          acceptance_text = acceptance.read_text()
          acceptance_text = acceptance_text.replace('arrivalDelay: boundaryDelays[index],', 'arrivalDelay: boundaryDelays[index]!,')
          acceptance_text = acceptance_text.replace('${forwardStops[(sequence - 1) % forwardStops.length]}', '${forwardStops[(sequence - 1) % forwardStops.length]!}')
          acceptance_text = acceptance_text.replace('${reverseStops[index]}', '${reverseStops[index]!}')
          acceptance_text = acceptance_text.replace('${cancelStops[index]}', '${cancelStops[index]!}')
          acceptance_text = acceptance_text.replace(
              "        sum((SELECT sum(bin) FROM unnest(delay_histogram) AS bin))::text AS histogram_total,",
              "        sum(histogram_bins.total)::text AS histogram_total,",
          )
          acceptance_text = acceptance_text.replace(
              "      FROM analytics.daily_stop_call_hour\n      WHERE service_date = $1::date AND scheduled_hour = 10",
              "      FROM analytics.daily_stop_call_hour\n      CROSS JOIN LATERAL (SELECT sum(bin)::bigint AS total FROM unnest(delay_histogram) AS bin) AS histogram_bins\n      WHERE service_date = $1::date AND scheduled_hour = 10",
              1,
          )
          acceptance.write_text(acceptance_text)
          PY

          git diff --check
          sha256sum migrations/0006_aggregation_retention.sql

      - name: Run TypeScript gate
        id: verify
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/m4-npm-ci.log
          npm run verify 2>&1 | tee /tmp/m4-verify.log

      - name: Run PostgreSQL 16 acceptance
        id: pg16
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/postgres-contract.sh postgres:16.14-bookworm 2>&1 | tee /tmp/m4-pg16.log

      - name: Persist patches and gate result
        if: always()
        shell: bash
        run: |
          mkdir -p .m4bootstrap
          {
            echo "head_before=$(git rev-parse HEAD)"
            echo "verify_outcome=${{ steps.verify.outcome }}"
            echo "pg16_outcome=${{ steps.pg16.outcome }}"
            echo "migration_sha256=$(sha256sum migrations/0006_aggregation_retention.sql | awk '{print $1}')"
            echo
            echo '--- VERIFY TAIL ---'
            tail -n 160 /tmp/m4-verify.log 2>/dev/null || true
            echo
            echo '--- POSTGRES 16 TAIL ---'
            tail -n 260 /tmp/m4-pg16.log 2>/dev/null || true
          } > .m4bootstrap/gate.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/0006_aggregation_retention.sql apps/worker/src/analytics.ts \
            tests/integration/postgres.test.ts tests/integration/milestone4.test.ts .m4bootstrap/gate.log
          if ! git diff --cached --quiet; then
            git commit -m 'test: materialize milestone 4 acceptance fixes'
            git pull --rebase origin feature-milestone-4
            git push origin HEAD:feature-milestone-4
          fi

      - name: Enforce gate result
        if: always()
        shell: bash
        run: |
          test '${{ steps.verify.outcome }}' = success
          test '${{ steps.pg16.outcome }}' = success

name: Frontend corrections lockfile refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/web/package.json
      - package-lock.json
      - .github/workflows/frontend-corrections-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/frontend-corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/frontend-corrections
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit deterministic lockfile if needed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(web): refresh lockfile'
          git push origin HEAD:feature/frontend-corrections

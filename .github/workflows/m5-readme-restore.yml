name: Restore Milestone 5 README

on:
  push:
    branches:
      - feature-milestone-5

permissions:
  contents: write

jobs:
  restore-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature-milestone-5
      - name: Restore accepted documentation and layer Milestone 5 changes
        shell: bash
        env:
          MILESTONE4_BASE: 0563dcaa9c9c1d9d7bea3596e3ccaf8b4f0d58b6
        run: |
          set -Eeuo pipefail
          git show "${MILESTONE4_BASE}:README.md" > README.md
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text()

          intro_start = text.index('# Atodotren\n\n') + len('# Atodotren\n\n')
          intro_end = text.index('\n\n## Prerequisites', intro_start)
          intro = '''Milestone 5 CI readiness adds a provider-neutral reporting layer and a private,
          read-only Telegram operations service to the accepted Milestone 4 evidence foundation.
          The service is a separate portable container, uses least-privilege PostgreSQL reporting
          credentials, and is prepared for a two-week Pi evidence pilot. The CI-readiness gate
          runs the repository contract, strict TypeScript/lint/unit checks, stock PostgreSQL
          16.14 and 18.4 contracts, native and amd64/arm64 image builds, and the isolated
          fake-Telegram Compose smoke before this phase can be considered ready. This CI phase
          does not deploy the pilot, select a managed provider, build the frontend, or accept
          Milestone 5.'''
          text = text[:intro_start] + intro + text[intro_end:]

          commands_start = text.index('## Commands\n\n') + len('## Commands\n\n')
          commands_end = text.index('\n\n## Realtime ingestion', commands_start)
          commands = '''The CLI contract is visible with `npm run worker -- --help`. Milestone 5 implements
          `worker report` in addition to the accepted ingestion, canonicalization, aggregation,
          finalization, replay and doctor commands. `worker report` emits stable bounded JSON by
          default or concise text with `--text`. Legacy worker Telegram delivery is disabled at
          the Milestone 5 CLI boundary; SMTP compatibility remains, while `telegram-ops` is the
          sole Telegram Bot API sender. Usage errors exit `2`; runtime failures exit `1`.'''
          text = text[:commands_start] + commands + text[commands_end:]

          pattern = re.compile(
              r'`HEARTBEAT_URL` is optional and is called only after a successful fetch plus\n'
              r'durable PostgreSQL or spool persistence\..*?Ordinary tests use fake transports and never send messages\.',
              re.S,
          )
          replacement = '''`HEARTBEAT_URL` is optional and is called only after a successful fetch plus
          durable PostgreSQL or spool persistence. In Milestone 5 the ingestion worker persists
          durable incident episodes and may retain SMTP compatibility, but it does not send
          Telegram messages. The separate `telegram-ops` process is the sole Telegram Bot API
          sender and reads the same durable incident facts through its least-privilege reporting
          contract. Ordinary tests use fake transports and the CI Telegram server; they never
          contact a real bot or SMTP endpoint.'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('expected heartbeat/alert paragraph was not found exactly once')

          text = text.rstrip() + '''

## Milestone 5 reporting and private Telegram operations

Milestone 5 adds a shared, provider-neutral reporting layer used by both `worker report`
and the private Telegram operations service. Reporting uses stock PostgreSQL views and
parameterized queries; aggregate-derived values are labeled with their precision and
histogram-derived medians remain explicitly approximate. Service dates and digest
scheduling use `Europe/Madrid`.

`telegram-ops` is a separate service in `compose.yaml`. It has no public port, Docker
socket, privileged mode, or production test fixture. It uses the dedicated
`atodotren_telegram` login, which inherits only `atodotren_reporting_reader`: approved
reporting views are read-only, while the login can write only its own bounded checkpoint,
delivery, callback, and monitor state. It cannot `SET ROLE` into ingestion or migration
roles. Telegram state has explicit retention and does not persist command/report bodies,
chart bytes, long arguments, or Bot API responses.

The bot uses the official Bot API directly with `getUpdates` long polling. Startup fails
if a webhook is configured, only message/callback updates are requested, and a PostgreSQL
advisory lock prevents two pollers from consuming the same bot concurrently. Authorization
requires the exact configured user id, exact private chat id, and private chat type;
unauthorized updates receive no reply and logs contain bounded metadata rather than message
text or credentials. Commands are scoped to that private chat and include `/status`,
`/daily`, `/line`, `/station`, `/trains`, `/train`, `/incidents`, `/resources`, `/pilot`,
and `/help`. Accent/case-insensitive lookup uses bounded candidates and inline callback
buttons for ambiguity.

The daily digest begins readiness checks at 04:00 Madrid time, targets 05:00 after verified
finalization, and sends a provisional/finalization-blocked digest from 06:30 if necessary.
Delivery keys are restart-safe per service date/report version. Bot-owned monitors cover
durable-ingestion staleness, sustained CPU/memory pressure, disk warning/critical state,
static-feed age, and consecutive PostgreSQL availability failures. Resource collection is
portable: process/cgroup, spool filesystem, reporting database size, and optional explicit
read-only host mounts; missing worker-container metrics are reported as unavailable rather
than fabricated and no Docker socket is required.

PNG chart delivery is intentionally deferred in this CI-only phase because adding a chart
renderer would require a new production dependency and lockfile change. Reporting already
emits a bounded chart specification and Telegram provides the text fallback, so a later
phase can add PNG rendering without changing metric semantics.

The Milestone 5 CI gate proves migrations 0001-0008 are unchanged, scans tracked files for
credential-shaped artifacts and obsolete acceptance-monitor traces, runs strict typecheck,
lint and unit tests, exercises the database contract on official PostgreSQL 16.14 and 18.4,
builds the production image for amd64 and arm64, proves fake Telegram fixtures are excluded
from that image, and runs the isolated fake-Telegram Compose smoke including restart and
incident/recovery delivery behavior. A green CI gate means this implementation is ready for
the Pi launch/pilot phase; it does not mean the two-week pilot or Milestone 5 has been
accepted.
'''

          if '## Aggregation, finalization, and retention operations' not in text:
              raise SystemExit('accepted Milestone 4 README tail was not restored')
          if '## Milestone 5 reporting and private Telegram operations' not in text:
              raise SystemExit('Milestone 5 README section was not added')
          path.write_text(text)
          PY
          git diff --check
          grep -F '## Aggregation, finalization, and retention operations' README.md >/dev/null
          grep -F '## Milestone 5 reporting and private Telegram operations' README.md >/dev/null
      - name: Commit self-cleaning documentation fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/m5-readme-restore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: restore accepted README and document milestone 5'
          git push origin HEAD:feature-milestone-5

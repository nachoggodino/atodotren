name: Milestone 5 lint remediation 3

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-5
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Apply typed lint remediation
        run: python3 scripts/m5-lint-remediate.py
      - name: Correct additive migration contract test
        run: python3 scripts/m5-test-contract-fix.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: git diff --check
      - name: Commit only verified remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm scripts/m5-lint-remediate.py scripts/m5-test-contract-fix.py
          rm .github/workflows/m5-lint-fix.yml .github/workflows/m5-lint-fix2.yml .github/workflows/m5-lint-fix3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy milestone 5 lint and unit contracts'
          git push origin HEAD:feature-milestone-5

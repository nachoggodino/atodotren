name: M4 Inspect Schema

on:
  push:
    branches:
      - feature-milestone-4
    paths:
      - '.github/workflows/m4-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
      - name: Build schema API outline
        shell: bash
        run: |
          {
            sha256sum migrations/0006_aggregation_retention.sql
            echo
            grep -nE '^(CREATE (OR REPLACE )?FUNCTION|CREATE TABLE|CREATE AGGREGATE|GRANT EXECUTE|CREATE (OR REPLACE )?VIEW)' migrations/0006_aggregation_retention.sql
          } > .m4bootstrap/recovered/schema-outline.txt
      - name: Commit outline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .m4bootstrap/recovered/schema-outline.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: inspect milestone 4 schema API'
            git push origin HEAD:feature-milestone-4
          fi

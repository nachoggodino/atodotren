name: M4 Sealed Version Guard

on:
  push:
    branches:
      - feature-milestone-4
    paths:
      - '.github/workflows/m4-sealed-version-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
          fetch-depth: 0
      - name: Guard sealed aggregate versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('migrations/0006_aggregation_retention.sql')
          sql = migration.read_text()
          anchor = """  PERFORM pg_advisory_xact_lock(hashtextextended('aggregate:daily:' || target_date::text, 0));

  DELETE FROM analytics.daily_stop_call_hour WHERE service_date = target_date;
"""
          guarded = """  PERFORM pg_advisory_xact_lock(hashtextextended('aggregate:daily:' || target_date::text, 0));

  IF EXISTS (
    SELECT 1 FROM operations.month_seal
    WHERE calendar_month = date_trunc('month', target_date)::date
      AND aggregate_algorithm_version = algorithm_version
      AND status = 'sealed'
  ) THEN
    SELECT count(*) INTO source_rows FROM core.journey_stop WHERE service_date = target_date;
    source_checksum_value := analytics.canonical_source_checksum(target_date);
    INSERT INTO analytics.aggregation_run (
      service_date, family, aggregate_algorithm_version, generation, started_at, completed_at,
      status, source_row_count, aggregate_row_count, source_checksum, blocker
    ) VALUES (
      target_date, 'daily', algorithm_version, dirty_generation, run_started, clock_timestamp(),
      'blocked', source_rows, 0, source_checksum_value, 'sealed_version_requires_new_algorithm'
    );
    RETURN jsonb_build_object(
      'serviceDate', target_date, 'status', 'blocked', 'sourceRows', source_rows,
      'aggregateRows', 0, 'sourceChecksum', source_checksum_value,
      'blocker', 'sealed_version_requires_new_algorithm'
    );
  END IF;

  DELETE FROM analytics.daily_stop_call_hour WHERE service_date = target_date;
"""
          if guarded not in sql:
              if anchor not in sql:
                  raise SystemExit('recompute_daily lock anchor missing')
              sql = sql.replace(anchor, guarded, 1)
          migration.write_text(sql)

          analytics = Path('apps/worker/src/analytics.ts')
          source = analytics.read_text()
          old = """      const report = jsonValue(result.rows[0]?.report);
      results.push(report);
      if (reportStatus(report) === 'noop') noops += 1;
      else succeeded += 1;
"""
          new = """      const report = jsonValue(result.rows[0]?.report);
      results.push(report);
      const status = reportStatus(report);
      if (status === 'noop') noops += 1;
      else if (status === 'succeeded') succeeded += 1;
      else errors.push(`${serviceDate}: aggregation ${status}`);
"""
          if new not in source:
              if old not in source:
                  raise SystemExit('aggregate status anchor missing')
              source = source.replace(old, new, 1)
          analytics.write_text(source)
          PY
          git diff --check
      - name: Commit sealed-version guard
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/0006_aggregation_retention.sql apps/worker/src/analytics.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: require new aggregate version after month sealing'
            git pull --rebase origin feature-milestone-4
            git push origin HEAD:feature-milestone-4
          fi

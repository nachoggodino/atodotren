name: M4 Fix Open Month Repair

on:
  push:
    branches:
      - feature-milestone-4
    paths:
      - '.github/workflows/m4-fix-open-month-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
          fetch-depth: 0
      - name: Invalidate unsealed contributions when canonical source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('migrations/0006_aggregation_retention.sql')
          text = path.read_text()
          old = """  UPDATE operations.retention_ledger
  SET revoked_at = clock_timestamp()
  WHERE family = 'canonical_detail' AND target_date = analytics.mark_dirty.target_date
    AND applied_at IS NULL AND revoked_at IS NULL;
END
$function$;
"""
          new = """  UPDATE operations.retention_ledger
  SET revoked_at = clock_timestamp()
  WHERE family = 'canonical_detail' AND target_date = analytics.mark_dirty.target_date
    AND applied_at IS NULL AND revoked_at IS NULL;

  -- An open month must have one replaceable contribution per service day/methodology.
  -- Preserve sealed results: repairing a sealed month requires a newer aggregate version.
  DELETE FROM analytics.daily_schedule_contribution AS contribution
  USING operations.service_day_finalization AS finalization
  WHERE contribution.service_date = analytics.mark_dirty.target_date
    AND finalization.service_date = contribution.service_date
    AND finalization.aggregate_algorithm_version = contribution.aggregate_algorithm_version
    AND NOT EXISTS (
      SELECT 1 FROM operations.month_seal AS seal
      WHERE seal.calendar_month = date_trunc('month', contribution.service_date)::date
        AND seal.aggregate_algorithm_version = contribution.aggregate_algorithm_version
        AND seal.status = 'sealed'
    );

  DELETE FROM operations.service_day_finalization AS finalization
  WHERE finalization.service_date = analytics.mark_dirty.target_date
    AND NOT EXISTS (
      SELECT 1 FROM operations.month_seal AS seal
      WHERE seal.calendar_month = date_trunc('month', finalization.service_date)::date
        AND seal.aggregate_algorithm_version = finalization.aggregate_algorithm_version
        AND seal.status = 'sealed'
    );
END
$function$;
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('mark_dirty anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          sha256sum migrations/0006_aggregation_retention.sql
      - name: Commit repair gate fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/0006_aggregation_retention.sql
          if ! git diff --cached --quiet; then
            git commit -m 'fix: replace unsealed schedule contributions after canonical repair'
            git pull --rebase origin feature-milestone-4
            git push origin HEAD:feature-milestone-4
          fi

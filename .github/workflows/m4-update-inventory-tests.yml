name: M4 Update Migration Inventory Tests

# serialized rerun including rotated-login inventory expectation
on:
  push:
    branches:
      - feature-milestone-4
    paths:
      - '.github/workflows/m4-update-inventory-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature-milestone-4
      - name: Include migration 0006 in integration inventory fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/postgres.test.ts')
          text = path.read_text()
          copy_0005 = """    cp(
      resolve(process.cwd(), 'migrations/0005_canonical_journeys.sql'),
      join(directory, '0005_canonical_journeys.sql'),
    ),
"""
          copy_0006 = """    cp(
      resolve(process.cwd(), 'migrations/0006_aggregation_retention.sql'),
      join(directory, '0006_aggregation_retention.sql'),
    ),
"""
          if copy_0006 not in text:
              if copy_0005 not in text:
                  raise SystemExit('0005 copy anchor not found')
              text = text.replace(copy_0005, copy_0005 + copy_0006, 1)
          old = "        '0005_canonical_journeys.sql',\n      ]);"
          new = "        '0005_canonical_journeys.sql',\n        '0006_aggregation_retention.sql',\n      ]);"
          count = text.count(old)
          if count not in (0, 3):
              raise SystemExit(f'unexpected migration expectation count: {count}')
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit inventory updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/postgres.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test: include migration 0006 in PostgreSQL inventory contracts'
            git push origin HEAD:feature-milestone-4
          fi
